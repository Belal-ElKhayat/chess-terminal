[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-terminal"
version = "1.2.0"
description = "A retro amber-CRT terminal chess workstation with BYOK AI opponents, peer-to-peer play and an opening library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chess.Terminal" }]
keywords = ["chess", "terminal", "textual", "tui", "ai"]
classifiers = [
    "Environment :: Console :: Curses",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "textual>=0.80",
    "python-chess>=1.999",
    "websockets>=13",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chessterminal = "chess_terminal.main:run"
chessterminal-server = "chess_terminal.server:run"

[tool.setuptools.packages.find]
include = ["chess_terminal*"]

[tool.setuptools.package-data]
chess_terminal = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
